name: Check Prospecta

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Syntax and local references
        run: npm run check
      - name: Domain and HTTP tests
        run: npm test
      - name: Prepare standalone static files
        run: npm run prepare:assets
      - name: Verify standalone startup
        run: npm run smoke
      - name: Upload static bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: prospecta-static
          path: dist/
          if-no-files-found: error
          retention-days: 30
